# SPDX-License-Identifier: GPL-3.0-or-later
# Licence check: cargo deny check licenses (run by scripts/check.sh).
# Every dependency must use a licence that can be combined with GPL-3.0-or-later.
[graph]
all-features = true
# Windows and macOS dependencies are checked too.
targets = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
]
confidence-threshold = 0.9
