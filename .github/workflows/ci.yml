# Runs on every push. The checks themselves are all in scripts/check.sh, so
# running that script locally gives the same result as this workflow.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Checks (scripts/check.sh)
    runs-on: ubuntu-24.04
    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Install the pinned Rust (rust-toolchain.toml, with rustfmt and clippy)
        run: rustup toolchain install

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Install pinned check tools (shellcheck 0.11.0, PyYAML 6.0.3)
        run: |
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --quiet shellcheck-py==0.11.0.1 pyyaml==6.0.3
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - name: Run all checks (fmt, clippy, build, tests, shell scripts, workflow files)
        run: sh scripts/check.sh
